<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stoaix Partner API Documentation</title>
  <meta name="description" content="stoaix Partner API reference — machine-to-machine integration for CRM, PMS, and external systems." />
  <link rel="icon" href="https://stoaix.com/assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <script
    id="api-reference"
    data-url="/openapi.json"
    data-configuration='{
      "theme": "kepler",
      "layout": "modern",
      "darkMode": true,
      "hiddenClients": ["cohttp"],
      "defaultHttpClient": { "targetKey": "node", "clientKey": "fetch" },
      "metadata": {
        "title": "stoaix Partner API",
        "description": "Machine-to-machine API for integrating external systems with stoaix platform."
      },
      "customCss": ".darklight-reference-promo { display: none !important; } .sidebar-heading { font-weight: 600 !important; }"
    }'
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
